server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/pki/tls/certs/resume-campaign-agent-ip.crt;
    ssl_certificate_key /etc/pki/tls/private/resume-campaign-agent-ip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RESUME_AGENT_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    auth_basic "Resume Campaign Agent";
    auth_basic_user_file /etc/nginx/.htpasswd-resume-agent;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store" always;

    location / {
        proxy_pass http://127.0.0.1:18010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
