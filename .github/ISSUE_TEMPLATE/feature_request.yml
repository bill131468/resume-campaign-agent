name: Feature request
description: 提议新的安全求职辅助能力
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 说明用户问题，而不是只描述实现。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: effects
    attributes:
      label: Data and side effects
      description: 会读取哪些数据、调用哪些外部服务、是否修改招聘网页？
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      options:
        - label: 方案不绕过 CAPTCHA、登录风控或网站访问控制。
          required: true
        - label: 方案保留逐岗位人工授权和失败关闭行为。
          required: true
