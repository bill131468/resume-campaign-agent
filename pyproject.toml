[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-campaign-agent"
version = "0.2.1"
description = "A Pydantic AI resume completion and safe job campaign agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Resume Campaign Agent contributors" },
]
keywords = ["pydantic-ai", "resume", "career", "job-search", "browser-extension"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "cryptography>=45,<47",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-ai-slim[openai]>=1.0,<2",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/redmaplewww/resume-campaign-agent"
Documentation = "https://github.com/redmaplewww/resume-campaign-agent/tree/main/docs"
Issues = "https://github.com/redmaplewww/resume-campaign-agent/issues"
Source = "https://github.com/redmaplewww/resume-campaign-agent"

[project.optional-dependencies]
test = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resume_campaign_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
