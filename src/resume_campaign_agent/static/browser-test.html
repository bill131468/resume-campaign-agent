<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>星河实业｜社会招聘申请表（安全演练）</title>
  <style>
    :root { --paper:#f4efdf; --ink:#252a26; --green:#274d3d; --amber:#c17b29; --line:#c9c0aa; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#d9d1bd; font:16px/1.5 Georgia,"Noto Serif SC",serif; }
    main { width:min(760px,calc(100% - 32px)); margin:40px auto; padding:46px; background:var(--paper); border:1px solid #b8ad94; box-shadow:0 18px 50px #4b45382b; }
    header { display:flex; justify-content:space-between; gap:24px; border-bottom:2px solid var(--green); padding-bottom:18px; margin-bottom:30px; }
    h1 { margin:0; font-size:27px; letter-spacing:.04em; } .seal { color:#9b3b31; border:2px solid; padding:5px 8px; transform:rotate(2deg); align-self:flex-start; font-weight:700; }
    .notice { padding:12px 14px; background:#ede5cf; border-left:4px solid var(--amber); font-size:14px; }
    form { display:grid; grid-template-columns:1fr 1fr; gap:20px 24px; margin-top:26px; }
    label { display:grid; gap:7px; font-weight:700; font-size:14px; }
    label.wide { grid-column:1 / -1; }
    input,select,textarea { width:100%; border:1px solid var(--line); background:#fffdf6; padding:11px 12px; font:15px system-ui,sans-serif; color:var(--ink); border-radius:2px; }
    textarea { min-height:110px; resize:vertical; }
    .consent { display:flex; grid-column:1 / -1; align-items:flex-start; font-weight:400; }
    .consent input { width:auto; margin-top:5px; }
    button { grid-column:1 / -1; padding:13px; color:white; background:#858579; border:0; font-weight:700; cursor:not-allowed; }
    footer { margin-top:22px; color:#6f6a5d; font-size:13px; }
    @media(max-width:620px){ main{padding:25px}.seal{display:none}form{grid-template-columns:1fr}label.wide,.consent,button{grid-column:auto} }
  </style>
</head>
<body>
  <main>
    <header><div><small>OFFICIAL CAREERS · MOCK</small><h1>星河实业社会招聘登记</h1></div><span class="seal">仅供演练</span></header>
    <p class="notice">这是本机模拟招聘页，用于验证浏览器副驾驶。页面不会联网，也无法提交。</p>
    <form id="mock-job-form" autocomplete="off">
      <label>候选人姓名 *<input name="candidate_name" autocomplete="name" required placeholder="请填写真实姓名" /></label>
      <label>电子邮箱 *<input type="email" name="contact_email" autocomplete="email" required placeholder="name@example.com" /></label>
      <label>手机号码 *<input type="tel" name="mobile" autocomplete="tel" required /></label>
      <label>现居城市<select name="current_city"><option value="">请选择</option><option>北京</option><option>上海</option><option>深圳</option><option>杭州</option><option>成都</option></select></label>
      <label>申请岗位<input name="position_applied" placeholder="希望申请的职位" /></label>
      <label>毕业院校<input name="university" /></label>
      <label>所学专业<input name="major" /></label>
      <label>最高学历<select name="degree"><option value="">请选择</option><option>大专</option><option>本科</option><option>硕士</option><option>博士</option></select></label>
      <label class="wide">专业技能<textarea name="skills" placeholder="请概述与岗位相关的技能"></textarea></label>
      <label class="wide">自我评价<textarea name="self_evaluation"></textarea></label>
      <label>登录密码<input type="password" name="account_password" /></label>
      <label>短信验证码<input inputmode="numeric" name="sms_otp" /></label>
      <label>身份证号码<input name="identity_document" /></label>
      <label>期望薪资<input name="expected_salary" /></label>
      <label class="consent"><input type="checkbox" name="privacy_consent" />我已阅读并同意隐私政策与候选人声明</label>
      <button type="submit" disabled>提交申请（演练页已禁用）</button>
    </form>
    <footer>安全断言：密码、验证码、身份证、薪资、同意项与提交按钮均不得被副驾驶操作。</footer>
  </main>
</body>
</html>
