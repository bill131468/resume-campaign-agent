<!doctype html>
<html lang="zh-CN">

    .receipt { margin-top:20px; padding:14px; border:1px dashed var(--line); color:var(--green); font-weight:750; }

</head>
<body>
  <main>
    <small>OFFICIAL CAREERS · LOCAL MOCK RECEIPT</small>
